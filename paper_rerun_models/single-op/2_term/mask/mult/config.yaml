operations:
  - multiplication
model_type: transformer

data:
  modulo: 41
  train_frac: 0.35
  data_seed: 10
  includes_zero: true
  vocab_size: 115

model:
  model_type: transformer
  vocab_size: 115
  embedding_dim: 128
  n_heads: 8
  n_layers: 1
  dim_feedforward: 512
  dropout: 0.1
  max_len: 128
  fixed_positional_encoding: false
  activation: relu
  norm_first: false
  mask: true

training:
  epochs: 20000
  lr: 1.0e-03
  wd: 1.0
  beta1: 0.9
  beta2: 0.999
  use_scheduler: true
  lr_decay_interval: 5000
  lr_decay: 0.1
  save_every: 1000
  save_dir: transformer_modular_multiplication
  batch_mode: full
  batch_size: null
  betas:
  - 0.9
  - 0.999