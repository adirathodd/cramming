operations:
  addition
model_type: transformer
data:
  modulo: 41
  nterms: 4
  train_frac: 0.01
  data_seed: 42
  includes_zero: true
  vocab_size: 43
model:

  model_type: transformer
  vocab_size: 43
  embedding_dim: 512
  n_heads: 8
  n_layers: 2
  dim_feedforward: 1024
  dropout: 0.0
  max_len: 8
  fixed_positional_encoding: false
  activation: relu
  norm_first: false
  mask: true
  tie_weights: true
training:

  epochs: 30000
  lr: 0.001
  wd: 1.0
  beta1: 0.9
  beta2: 0.98
  use_scheduler: true
  lr_decay_interval: 10000
  lr_decay: 0.1
  save_every: 2500
  save_dir: ./transformers/checkpoints_4term
  batch_mode: mini-batch
  batch_size: 8129
  training_target: last_token
  cot_prefix_weight: 1.0
  cot_final_weight: 1.0
  fourier_reg_mode: null
  fourier_reg_coefficient: 0.0
  fourier_reg_groups: 2
  dataloader_num_workers: 2
  eval_batch_size: 4096
  eval_every: 200
analysis:

  fourier_norm_threshold: 0.1
  freq_threshold_top_fraction: 0.1
  freq_threshold_min_components: 4
  freq_threshold_fixed: null